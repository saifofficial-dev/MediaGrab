<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaGrab - Universal Video Downloader</title>
    <meta name="description" content="Analyze publicly accessible video links, preview media formats and resolutions, and securely download authorized social media videos and audio." />
    <meta property="og:title" content="MediaGrab - Universal Video Downloader" />
    <meta property="og:description" content="Analyze publicly accessible video links, preview media formats and resolutions, and securely download authorized social media videos and audio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore WebSocket errors in AI Studio iframe environment where HMR is disabled
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && reason.message) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event.error && event.error.message) || event.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#0B1020] text-slate-100 font-sans antialiased selection:bg-[#635BFF]/30 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
